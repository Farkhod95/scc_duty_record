version: '3.9'

services:
  duty_record:
    build: .
    container_name: duty_record_web
    restart: always
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
#    entrypoint: ["./wait-for-it.sh", "db:5432", "--"]
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "main.asgi:application"]

  frontend:
    build:
      context: .
      dockerfile: ../jts-scc/Dockerfile
    container_name: duty_record_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - duty_record

  db:
    image: postgis/postgis:15-3.3
    container_name: duty_record_base
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: duty_record_db
      POSTGRES_USER: duty_record_user
      POSTGRES_PASSWORD: duty_record_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis
    container_name: duty_record_redis
    restart: always
    ports:
      - "6379:6379"

  celery:
    build: .
    command: celery -A main worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    command: celery -A main beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis

  location_service_db:
    image: postgres:16-alpine
    container_name: locationservice-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: LocationService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "52351"
    volumes:
      - locationservice_postgres_data:/var/lib/postgresql/data
      - ./LocationService/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LocationService"]
      interval: 5s
      timeout: 3s
      retries: 10

  location_service:
    build: ./LocationService
    container_name: locationservice-app
    restart: unless-stopped
    depends_on:
      location_service_db:
        condition: service_healthy
    environment:
      GRPC_PORT: 50051
      DATABASE_URL: postgres://postgres:52351@locationservice-db:5432/LocationService
      VEHICLE_API_URL: http://25.1.1.217:80/api/mobject/lastData
      VEHICLE_API_TOKEN: 6bq6kimsmhniuothjbkai715n2
      VEHICLE_POLL_INTERVAL: 30s
    ports:
      - "50051:50051"
    networks:
      - default
      - jts-scc_default

volumes:
  postgres_data:
    external: true
    name: scc_duty_record_postgres_data
  static_volume:
  locationservice_postgres_data:

networks:
  jts-scc_default:
    external: true
