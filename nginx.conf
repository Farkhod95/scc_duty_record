server {
    listen 80;

    # React frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/v1/map/tiles/(\d+)/(\d+)/(\d+)\.png$ {
        proxy_pass http://172.20.20.2/map/main/$1/$2/$3.png;
        proxy_set_header Host tosh.safecity.uz;
        proxy_set_header Referer http://tosh.safecity.uz/;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
        proxy_cache_valid 200 24h;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Django API
    location /api/ {
        proxy_pass http://duty_record_web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django WebSocket
    location /ws/ {
        proxy_pass http://duty_record_web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Django static va media
    location /static/ {
        proxy_pass http://duty_record_web:8000;
    }
    location /assets/ {
        root /usr/share/nginx/html;
    }

    location /media/ {
        proxy_pass http://duty_record_web:8000;
    }
}
