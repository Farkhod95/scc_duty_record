map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Xarita tile'larini tashqi manbadan olib beruvchi proxy
    location ~ ^/api/v1/map/tiles/(\d+)/(\d+)/(\d+)\.png$ {
        proxy_pass https://172.20.20.2/map/main/$1/$2/$3.png;
        proxy_ssl_server_name on;
        proxy_ssl_name        tosh.safecity.uz;
        proxy_ssl_verify      off;
        proxy_set_header Host tosh.safecity.uz;
        proxy_set_header Referer https://tosh.safecity.uz/;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
        proxy_cache_valid 200 24h;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Qolgan hammasi (React frontend, /api/, /ws/, /static/, /media/) — frontend konteyneriga
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
